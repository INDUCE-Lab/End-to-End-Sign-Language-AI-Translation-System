# ADAT configuration

batch_size: 32
max_video_length: 300    # placeholder; real value comes from dataset

max_gloss_length: 27     # placeholder; real value comes from dataset
max_text_length: 30      # placeholder; real value comes from dataset

gloss_vocab_size: 835    # placeholder; real value comes from dataset
text_vocab_size: 914     # placeholder; real value comes from dataset

embed_dim: 1024
encoder_layers: 12
decoder_layers: 12
hidden_units: 16

dropout_rate: 0.0
learning_rate: 5.0e-5
epochs: 100
